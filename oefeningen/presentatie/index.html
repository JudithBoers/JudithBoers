# Inspiratie voor de digital garden van Judith

Hoe mijn creatieve hobby's mijn omschrijven.

---

# Wat ga ik vertellen?

1. Mijn creatieve interesses
2. Waarom creativiteit belangrijk voor mij is
3. Van hobby naar side hustle
4. Patronen die ik in de beelden herken
5. Mijn inspiratiebronnen
6. Mijn idee voor een digital garden

---

# Mijn creatieve interesses

Mijn creativiteit komt op verschillende manieren terug. Ik haak, maak Pokémon binder art, ontwerp mijn eigen stickers en vul journals. Deze hobby’s lijken verschillend, maar bij alles maak ik van losse ideeën en materialen iets persoonlijks.

---

# Waarom vind ik dit leuk?

Creatief bezig zijn geeft mij de vrijheid om steeds iets nieuws te proberen. Ik kan mijn ideeën zichtbaar maken, kleuren en materialen combineren en een ontwerp blijven aanpassen totdat het echt bij mij past.

Ik vind vooral het proces leuk: beginnen met een klein idee en stap voor stap ontdekken wat het kan worden.

---

# Haken

Bij haken maak ik met één draad steeds verder een vorm. Ik kies kleuren en patronen, probeer nieuwe steken en zie langzaam een eindresultaat ontstaan.

Het is precies werk, maar tegelijkertijd ook rustgevend.

# Pokémon binder art

Bij binder art ontwerp ik een omgeving rondom een Pokémonkaart. Ik laat kleuren, vormen en landschappen uit de kaart doorlopen, zodat meerdere kaartvakjes samen één groter kunstwerk vormen.

Ik ontwerp het digitaal en maak het daarna met de hand af door te printen, plakken, snijden en alles in sleeves te plaatsen.

# Zelf stickers maken

Bij stickers kan ik kleine ideeën snel omzetten in iets tastbaars.

Ik bedenk een vorm, maak een illustratie, kies kleuren en zorg dat het ontwerp ook op klein formaat duidelijk en leuk blijft.

# Journalen

In mijn journal combineer ik herinneringen, kleuren, stickers, tekst en afbeeldingen.

Een pagina hoeft niet perfect te zijn. Juist door verschillende onderdelen te verzamelen en te combineren, ontstaat er iets persoonlijks.

# Van hobby naar side hustle

Mijn creatieve hobby’s zijn inmiddels ook een kleine side hustle geworden. Via mijn Etsy-shop verkoop ik producten die ik zelf heb ontworpen en gemaakt.

- Handgemaakte stickers
- Zelfgemaakte haakpatronen
- Pokémon binder art

# Wat herken ik in mijn beelden?

- Veel kleur, maar wel in combinaties die bij elkaar passen
- Speelse vormen en kleine details
- Zowel digitaal als met de hand werken
- Losse onderdelen samenbrengen tot één geheel
- Experimenteren en blijven aanpassen
- Iets maken dat persoonlijk en uniek voelt

De grootste overeenkomst is dat mijn ideeën tijdens het maken blijven groeien. Ik weet vooraf nog niet altijd precies hoe het eindresultaat wordt.

# Mijn website stijl 
Op mijn homepage wil ik mijn vier creatieve hobby’s laten zien. Bezoekers kunnen daarna per hobby verder kijken naar mijn inspiratie, proces en eindresultaten.

- Haken: patronen, materialen en gemaakte projecten
- Binder art: ontwerpen, Pokémonkaarten en mijn maakproces
- Stickers: schetsen, stickervellen en producten uit mijn Etsy-shop
- Journalen: pagina’s, herinneringen en inspiratie

De verschillende onderdelen worden met links aan elkaar verbonden. Zo kunnen bezoekers steeds verder door mijn creatieve wereld ontdekken.
